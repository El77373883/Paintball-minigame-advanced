name: Build & Validate PaintballPlugin (Premium 2.0)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configurar Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      # 3. Construir con Maven y capturar errores
      - name: Build with Maven
        id: maven_build
        run: |
          mvn clean package
        continue-on-error: true

      # 4. Validar existencia de config.yml
      - name: Check config.yml
        run: |
          if [ ! -f src/main/resources/config.yml ]; then
            echo "❌ config.yml no encontrado!"
            exit 1
          fi
          echo "✅ config.yml encontrado."

      # 5. Validar opciones básicas de config (puedes ampliar según tu plugin)
      - name: Validate basic config keys
        run: |
          missing_keys=0
          keys=("arenas" "default_coins" "snowballs_per_stack")
          for key in "${keys[@]}"; do
            if ! grep -q "^$key:" src/main/resources/config.yml; then
              echo "❌ Falta la clave '$key' en config.yml"
              missing_keys=$((missing_keys+1))
            fi
          done
          if [ $missing_keys -gt 0 ]; then
            echo "❌ Se detectaron $missing_keys errores de config.yml"
            exit 1
          else
            echo "✅ Todas las claves básicas existen en config.yml"
          fi

      # 6. Revisar si hubo errores de compilación
      - name: Check for Build Errors
        if: ${{ steps.maven_build.outcome != 'success' }}
        run: |
          echo "❌ Error detectado en la compilación del plugin!"
          echo "Revisa los logs de Maven."
          exit 1

      # 7. Subir el JAR generado como artifact descargable
      - name: Upload JAR artifact
        if: ${{ steps.maven_build.outcome == 'success' }}
        uses: actions/upload-artifact@v3
        with:
          name: PaintballPlugin-JAR
          path: target/*.jar

      # 8. Badge de build (opcional, puedes integrar en README)
      - name: Generate Build Badge
        if: ${{ steps.maven_build.outcome == 'success' }}
        run: |
          echo "✅ PaintballPlugin JAR generado correctamente y listo para Spigot 1.21.11"

      # 9. Mensaje final de log
      - name: Build Complete
        if: ${{ steps.maven_build.outcome == 'success' }}
        run: |
          echo "🎉 Build final completada!"
          echo "Archivo JAR listo para descargar desde los artifacts."
