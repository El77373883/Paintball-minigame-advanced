name: Build Paintball Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compile & Package PaintballPlugin
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      # 3️⃣ Cache de dependencias Maven
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4️⃣ Compilar el proyecto
      - name: Build with Maven
        run: mvn clean package

      # 5️⃣ Subir el JAR compilado como artifact
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paintball-plugin
          path: target/*.jar

      # 6️⃣ Marcar error si falla Maven
      - name: Compilation Check
        if: failure()
        run: echo "::error ::¡Compilación fallida! Revisa los errores de Maven."
