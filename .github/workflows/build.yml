name: Build Paintball Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compile PaintballPlugin
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      # 3️⃣ Construir el proyecto con Maven
      - name: Build with Maven
        run: mvn clean package

      # 4️⃣ Subir el .jar compilado como artefacto
      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: paintball-plugin
          path: target/*.jar
